[build]
  command = "npm run build"
  publish = "dist"

# Browser talks to same origin; Netlify forwards to the API (avoids CORS).
[[redirects]]
  from = "/api/*"
  to = "https://co-pilot.fastapicloud.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
